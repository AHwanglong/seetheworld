<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbf6"/>
      <stop offset="55%" stop-color="#eef7ef"/>
      <stop offset="100%" stop-color="#f8f3e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b3b2a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#1f7a4d"/>
    </marker>
    <style>
      .title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 48px; font-weight: 800; fill: #173f2a; }
      .subtitle { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; fill: #52645a; }
      .region { fill: #d9eadf; stroke: #8dbb9c; stroke-width: 3; opacity: .72; }
      .route { fill: none; stroke: #1f7a4d; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .route-soft { fill: none; stroke: #93b99f; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; opacity: .25; }
      .node { fill: #fffef8; stroke: #1f7a4d; stroke-width: 5; }
      .node-main { fill: #1f7a4d; stroke: #f6d56e; stroke-width: 7; }
      .node-label { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 800; fill: #173f2a; }
      .node-label-main { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 32px; font-weight: 900; fill: #173f2a; }
      .day { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #af6b1f; }
      .meta { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #5d6f64; }
      .distance { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #2e6b48; }
      .tag { fill: #fff8df; stroke: #e1bd54; stroke-width: 2; }
      .legend-title { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 800; fill: #173f2a; }
      .legend { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 19px; fill: #52645a; }
      .small { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #6b7d72; }
    </style>
  </defs>

  <rect width="1400" height="920" rx="42" fill="url(#bg)"/>

  <path class="region" d="M807 104 C936 123 1051 174 1118 272 C1184 368 1150 465 1212 551 C1269 631 1261 742 1164 792 C1053 849 923 821 801 838 C676 856 551 835 455 759 C367 690 334 587 268 498 C195 399 212 291 298 221 C389 148 511 154 617 118 C681 96 742 94 807 104Z"/>

  <text x="78" y="96" class="title">长沙起止自驾行程地图</text>
  <text x="82" y="138" class="subtitle">张家界 · 芙蓉镇 · 德夯/茶峒 · 凤凰古城环线</text>

  <path class="route-soft" d="M880 710 C760 650 620 515 530 310"/>
  <path class="route" d="M880 710 C760 650 620 515 530 310"/>
  <path class="route-soft" d="M530 310 C433 392 397 505 450 626"/>
  <path class="route" d="M530 310 C433 392 397 505 450 626"/>
  <path class="route-soft" d="M450 626 C380 595 336 574 300 538"/>
  <path class="route" d="M450 626 C380 595 336 574 300 538"/>
  <path class="route-soft" d="M300 538 C305 642 395 734 518 762"/>
  <path class="route" d="M300 538 C305 642 395 734 518 762"/>
  <path class="route-soft" d="M518 762 C660 805 786 787 880 710"/>
  <path class="route" d="M518 762 C660 805 786 787 880 710"/>

  <g transform="translate(880 710)" filter="url(#shadow)">
    <circle r="28" class="node-main"/>
    <circle r="10" fill="#fff8df"/>
  </g>
  <text x="918" y="702" class="node-label-main">长沙</text>
  <text x="920" y="730" class="day">D1 出发 / D8 返回</text>
  <text x="920" y="756" class="meta">长沙南站取还车</text>

  <g transform="translate(530 310)" filter="url(#shadow)">
    <circle r="25" class="node"/>
    <circle r="9" fill="#1f7a4d"/>
  </g>
  <text x="565" y="302" class="node-label">张家界</text>
  <text x="568" y="329" class="day">D1-D4</text>
  <text x="568" y="354" class="meta">森林公园 · 天门山</text>

  <g transform="translate(450 626)" filter="url(#shadow)">
    <circle r="23" class="node"/>
    <circle r="8" fill="#1f7a4d"/>
  </g>
  <text x="486" y="620" class="node-label">芙蓉镇</text>
  <text x="489" y="647" class="day">D5</text>
  <text x="489" y="672" class="meta">古镇瀑布 · 夜景</text>

  <g transform="translate(300 538)" filter="url(#shadow)">
    <circle r="23" class="node"/>
    <circle r="8" fill="#1f7a4d"/>
  </g>
  <text x="92" y="526" class="node-label">德夯 / 茶峒</text>
  <text x="137" y="553" class="day">D6-D7</text>
  <text x="52" y="578" class="meta">苗寨 · 矮寨大桥 · 边城</text>

  <g transform="translate(518 762)" filter="url(#shadow)">
    <circle r="23" class="node"/>
    <circle r="8" fill="#1f7a4d"/>
  </g>
  <text x="552" y="756" class="node-label">凤凰古城</text>
  <text x="555" y="783" class="day">D7-D8</text>
  <text x="555" y="808" class="meta">沱江夜景 · 古城晨景</text>

  <g>
    <rect x="682" y="472" width="192" height="42" rx="21" class="tag"/>
    <text x="705" y="500" class="distance">约350公里 / 4小时</text>

    <rect x="405" y="455" width="214" height="42" rx="21" class="tag"/>
    <text x="431" y="483" class="distance">约105公里 / 1小时45分</text>

    <rect x="258" y="612" width="210" height="42" rx="21" class="tag"/>
    <text x="286" y="640" class="distance">约255公里 / 半日</text>

    <rect x="318" y="698" width="190" height="42" rx="21" class="tag"/>
    <text x="344" y="726" class="distance">约140公里 / 3小时</text>

    <rect x="648" y="802" width="190" height="42" rx="21" class="tag"/>
    <text x="675" y="830" class="distance">约400公里 / 5小时</text>
  </g>

  <g transform="translate(912 158)" filter="url(#shadow)">
    <rect width="388" height="232" rx="28" fill="#fffef8" stroke="#d8e7dc" stroke-width="2"/>
    <text x="30" y="48" class="legend-title">路线节奏</text>
    <text x="30" y="86" class="legend">1. 长沙取车后直达张家界</text>
    <text x="30" y="120" class="legend">2. 张家界连住，集中游览三条线</text>
    <text x="30" y="154" class="legend">3. 西行串联芙蓉镇、德夯、茶峒</text>
    <text x="30" y="188" class="legend">4. 凤凰古城收尾，返长沙还车</text>
    <text x="30" y="218" class="small">公里与时间为路书预估，用于行程节奏参考。</text>
  </g>

  <text x="82" y="864" class="small">示意图非等比例地图；节点位置为阅读和展示优化。</text>
</svg>
